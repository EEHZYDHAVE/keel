<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keel · Investment Research</title>
<meta name="description" content="A personal investment research and decision support workspace.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0D12">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keel">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D12; --surface:#10141B; --surface2:#141922; --elevated:#1A2029; --overlay:#0A0D12CC;
  --border:#222836; --border-soft:#1A2029;
  --text:#E7EAF0; --text2:#9AA4B6; --muted:#616B7D;
  --accent:#5B8DEF; --accent-soft:#5B8DEF1F; --accent-dim:#3E5C99;
  --positive:#39B978; --positive-soft:#39B9781A;
  --negative:#E15A63; --negative-soft:#E15A631A;
  --warning:#D6A544; --warning-soft:#D6A5441A;
  --purple:#8C7EF0; --purple-soft:#8C7EF01A;
  --radius:10px; --radius-sm:7px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
:root:not([data-theme="light"]){ color-scheme: dark; }
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F5F6F8; --surface:#FFFFFF; --surface2:#F1F3F6; --elevated:#E9ECF1; --overlay:#1B222EBB;
  --border:#DEE2E9; --border-soft:#E7EAEF;
  --text:#161B24; --text2:#565F70; --muted:#8991A1;
  --accent:#3E68C9; --accent-soft:#3E68C91A; --accent-dim:#7C99DE;
  --positive:#1E9A5C; --positive-soft:#1E9A5C17;
  --negative:#D5424B; --negative-soft:#D5424B17;
  --warning:#B4791E; --warning-soft:#B4791E17;
  --purple:#6D5CDB; --purple-soft:#6D5CDB17;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#252C39;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.num{font-variant-numeric:tabular-nums;}

/* ---------- layout shell ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:232px; flex:none; background:var(--surface); border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  transition:width .16s ease;
}
.sidebar.collapsed{width:64px;}
.sidebar.collapsed .side-label, .sidebar.collapsed .side-group, .sidebar.collapsed .brand-text, .sidebar.collapsed .nav-badge{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;}
.brand{display:flex; align-items:center; gap:9px; padding:0 16px 16px; cursor:pointer;}
.brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(155deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;flex:none;}
.brand-mark svg{width:14px;height:14px;}
.brand-text .t1{font-weight:700;font-size:14.5px;letter-spacing:-.01em;}
.brand-text .t2{font-size:10.5px;color:var(--muted);}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;padding:5px 9px 5px 5px;border-radius:20px;margin-bottom:10px;}
.back-btn:hover{background:var(--elevated);color:var(--text);}
.back-btn svg{width:15px;height:15px;}
.search-wrap{position:relative;flex:1;max-width:460px;}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:0 10px 28px #00000055;z-index:40;max-height:320px;overflow-y:auto;}
.search-results .sr-item{display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer;}
.search-results .sr-item:hover{background:var(--surface2);}
.search-results .sr-empty{padding:14px;font-size:12px;color:var(--muted);text-align:center;}
.avatar-wrap{position:relative;}
.avatar-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:0 10px 28px #00000055;width:200px;z-index:40;padding:6px;}
.avatar-menu .am-head{padding:8px 9px;font-size:12px;font-weight:600;border-bottom:1px solid var(--border-soft);margin-bottom:4px;}
.avatar-menu .am-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;font-size:12px;color:var(--text2);border-radius:6px;cursor:pointer;}
.avatar-menu .am-item:hover{background:var(--surface2);color:var(--text);}
.theme-switch{width:34px;height:19px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;flex:none;}
.theme-switch .knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--text);transition:transform .15s ease;}
.theme-switch.on{background:var(--accent);}
.theme-switch.on .knob{transform:translateX(15px);background:#fff;}
.side-scroll{flex:1;overflow-y:auto;padding:2px 10px 10px;}
.side-group{font-size:10.5px;font-weight:600;letter-spacing:.07em;color:var(--muted);padding:14px 8px 6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--radius-sm);
  color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:1px;position:relative;
}
.nav-item:hover{background:var(--elevated);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--text);}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:2.5px;background:var(--accent);border-radius:2px;}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.9;}
.nav-badge{margin-left:auto;font-size:10.5px;color:var(--muted);background:var(--elevated);border:1px solid var(--border-soft);padding:1px 6px;border-radius:20px;}
.side-foot{border-top:1px solid var(--border-soft);padding:10px;}
.collapse-btn{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;cursor:pointer;padding:6px 8px;border-radius:var(--radius-sm);}
.collapse-btn:hover{background:var(--elevated);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;
  border-bottom:1px solid var(--border-soft);background:var(--bg);position:sticky;top:0;z-index:20;
  padding-top:env(safe-area-inset-top,0px);
}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 11px;color:var(--muted);}
.search input{background:none;border:none;color:var(--text);font-size:12.5px;width:100%;}
.search input::placeholder{color:var(--muted);}
.search svg{width:14px;height:14px;flex:none;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
.save-indicator{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.save-dot{width:5px;height:5px;border-radius:50%;background:var(--positive);}
.save-dot.saving{background:var(--warning);}
.icon-btn{width:30px;height:30px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;border:1px solid transparent;}
.icon-btn:hover{background:var(--elevated);border-color:var(--border-soft);}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(155deg,var(--purple),var(--accent));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;}

.content{flex:1;padding:22px 26px 60px;max-width:1400px;width:100%;margin:0 auto;}

/* ---------- headers / tabs ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px;}
.crumb{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.crumb b{color:var(--text2);font-weight:500;}
.page-title{font-size:21px;font-weight:700;letter-spacing:-.015em;margin:0 0 4px;}
.page-sub{color:var(--text2);font-size:12.5px;max-width:640px;}
.head-meta{text-align:right;font-size:11px;color:var(--muted);white-space:nowrap;}
.head-meta .lbl{display:block;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-soft);margin-bottom:20px;overflow-x:auto;}
.tab{padding:9px 3px;margin-right:22px;font-size:12.5px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);}
.btn:hover{background:var(--elevated);}
.btn svg{width:13px;height:13px;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#4D80DE;}
.btn-ghost{background:none;border-color:transparent;color:var(--text2);}
.btn-ghost:hover{background:var(--elevated);color:var(--text);}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn-danger{color:var(--negative);}

/* ---------- grid / cards ---------- */
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:2fr 1.3fr 1.1fr;}
.grid-2{grid-template-columns:1.4fr 1fr;}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3,.grid-2{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.card-title{font-size:12.5px;font-weight:600;}
.card-link{font-size:11.5px;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:3px;}

.kpi{display:flex;align-items:flex-start;gap:11px;}
.kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
.kpi-icon svg{width:16px;height:16px;}
.kpi-val{font-size:22px;font-weight:700;letter-spacing:-.01em;}
.kpi-lbl{font-size:11.5px;color:var(--text2);margin-top:1px;}
.kpi-delta{font-size:10.5px;color:var(--muted);margin-top:3px;}
.up{color:var(--positive);}
.down{color:var(--negative);}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.03em;padding:0 10px 8px;white-space:nowrap;border-bottom:1px solid var(--border-soft);}
th.num,td.num{text-align:right;}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--elevated);}
.row-name{display:flex;align-items:center;gap:9px;}
.row-avatar{width:26px;height:26px;border-radius:7px;background:var(--elevated);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--text2);flex:none;}
.row-main{font-weight:600;font-size:12.5px;}
.row-sub{font-size:11px;color:var(--muted);}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;}
.pill-lg{padding:3px 11px;font-size:13px;}
.pill.s-high{background:var(--positive-soft);color:var(--positive);}
.pill.s-mid{background:var(--warning-soft);color:var(--warning);}
.pill.s-low{background:var(--negative-soft);color:var(--negative);}
.pill.s-neu{background:var(--elevated);color:var(--text2);}

.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;}
.status-badge::before{content:"";width:6px;height:6px;border-radius:50%;}
.st-draft{background:var(--elevated);color:var(--text2);}.st-draft::before{background:var(--muted);}
.st-inprogress{background:var(--accent-soft);color:var(--accent);}.st-inprogress::before{background:var(--accent);}
.st-complete{background:var(--positive-soft);color:var(--positive);}.st-complete::before{background:var(--positive);}
.st-needsreview{background:var(--negative-soft);color:var(--negative);}.st-needsreview::before{background:var(--negative);}
.st-watching{background:var(--purple-soft);color:var(--purple);}.st-watching::before{background:var(--purple);}
.st-archived{background:var(--elevated);color:var(--muted);}.st-archived::before{background:var(--muted);}

/* ---------- misc components ---------- */
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.bar{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent-dim));border-radius:4px 4px 2px 2px;min-height:2px;}
.bar-pct{font-size:10.5px;color:var(--muted);}
.bar-lbl{font-size:10.5px;color:var(--text2);}

.attn-row, .list-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);}
.attn-row:last-child,.list-row:last-child{border-bottom:none;}
.dot-warn{width:7px;height:7px;border-radius:50%;background:var(--warning);flex:none;}
.list-avatar{width:26px;height:26px;border-radius:7px;background:var(--elevated);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text2);flex:none;}
.list-main{flex:1;min-width:0;}
.list-title{font-size:12.5px;font-weight:600;}
.list-sub{font-size:11px;color:var(--muted);}
.list-time{font-size:11px;color:var(--muted);white-space:nowrap;}

.radial{position:relative;width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
.radial-inner{position:absolute;inset:9px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.radial-val{font-size:27px;font-weight:800;line-height:1;}
.radial-of{font-size:10px;color:var(--muted);margin-top:2px;}

.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 11px;font-size:12px;color:var(--text2);cursor:pointer;}
.chip svg{width:12px;height:12px;}
.select-native{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;padding:6px 10px;border-radius:20px;cursor:pointer;}
.search-inline{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;flex:1;min-width:180px;max-width:280px;}
.search-inline input{background:none;border:none;color:var(--text);font-size:12px;width:100%;}
.search-inline svg{width:12px;height:12px;color:var(--muted);}

.empty-state{padding:44px 20px;text-align:center;}
.empty-state svg{width:34px;height:34px;color:var(--muted);margin-bottom:12px;}
.empty-title{font-size:13.5px;font-weight:600;margin-bottom:4px;}
.empty-sub{font-size:12px;color:var(--muted);max-width:340px;margin:0 auto 16px;}

/* accordion / assessment */
.accordion{border:1px solid var(--border-soft);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.acc-head{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;background:var(--surface);}
.acc-head:hover{background:var(--surface2);}
.acc-chev{width:14px;height:14px;color:var(--muted);transition:transform .12s ease;flex:none;}
.accordion.open .acc-chev{transform:rotate(90deg);}
.acc-title{font-weight:600;font-size:13px;flex:1;}
.acc-title .tag{font-size:9.5px;color:var(--negative);background:var(--negative-soft);padding:1px 6px;border-radius:20px;margin-left:8px;font-weight:700;letter-spacing:.03em;vertical-align:1px;}
.acc-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:10px;}
.acc-body{padding:2px 15px 14px;border-top:1px solid var(--border-soft);}
.acc-desc{font-size:11.5px;color:var(--muted);padding:11px 0 2px;}
.progress-track{width:64px;height:5px;border-radius:4px;background:var(--elevated);overflow:hidden;flex:none;}
.progress-fill{height:100%;background:var(--accent);}
.progress-track.thin{width:44px;height:4px;}

.criterion{border-top:1px solid var(--border-soft);padding:14px 0;}
.criterion:first-child{border-top:none;}
.crit-name{font-size:12.5px;font-weight:600;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;}
.crit-row{display:flex;align-items:flex-start;gap:34px;margin-bottom:9px;}
.crit-field{display:flex;flex-direction:column;gap:4px;}
.crit-field-lbl{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;}
.scale{display:flex;gap:4px;}
.scale-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.scale-btn:hover{border-color:var(--accent);}
.scale-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.scale-btn.risk.on{background:var(--positive);border-color:var(--positive);}
.scale-hint{font-size:10px;color:var(--muted);margin-top:2px;}
textarea.reason{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;padding:8px 10px;resize:vertical;min-height:52px;font-family:var(--font);line-height:1.5;}
textarea.reason::placeholder{color:var(--muted);}
.evidence-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.evidence-chip{font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.evidence-chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;line-height:1;padding:0;}
.add-evidence{font-size:11px;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-top:7px;}

.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
.metric-box{background:var(--surface2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:10px 12px;}
.metric-box label{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:5px;}
.metric-box input{width:100%;background:none;border:none;color:var(--text);font-size:14.5px;font-weight:700;padding:0;font-variant-numeric:tabular-nums;}
.metric-box input::placeholder{color:var(--muted);font-weight:500;font-size:12.5px;}
.field-full{margin-bottom:14px;}
.field-full label{display:block;font-size:11px;color:var(--text2);font-weight:600;margin-bottom:6px;}
.field-full textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12.5px;padding:10px 12px;resize:vertical;min-height:72px;font-family:var(--font);line-height:1.55;}
.field-full input[type=text],.field-full input[type=date]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12.5px;padding:8px 12px;}

.callout{background:var(--surface2);border:1px solid var(--border-soft);border-left:2.5px solid var(--accent);border-radius:var(--radius-sm);padding:10px 13px;font-size:11.5px;color:var(--text2);margin-bottom:16px;}
.callout.warn{border-left-color:var(--warning);}
.callout b{color:var(--text);}

.score-explain{display:grid;gap:1px;background:var(--border-soft);border:1px solid var(--border-soft);border-radius:var(--radius-sm);overflow:hidden;}
.se-row{display:grid;grid-template-columns:1.6fr .7fr .7fr .9fr;gap:8px;background:var(--surface);padding:9px 12px;font-size:12px;align-items:center;}
.se-row.head{background:var(--surface2);font-size:10.5px;color:var(--muted);font-weight:600;}
.se-row .n{text-align:right;font-variant-numeric:tabular-nums;}

.modal-overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:8vh 20px 20px;overflow-y:auto;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:560px;padding:22px;}
.modal.wide{max-width:680px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:15px;font-weight:700;}
.modal-close{cursor:pointer;color:var(--muted);width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.modal-close:hover{background:var(--elevated);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.form-field label{display:block;font-size:11px;color:var(--text2);font-weight:600;margin-bottom:6px;}
.form-field input,.form-field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12.5px;padding:8px 11px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--elevated);border:1px solid var(--border);padding:9px 16px;border-radius:20px;font-size:12px;z-index:200;box-shadow:0 8px 24px #00000055;}

.caveat{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:8px;}
.caveat svg{width:11px;height:11px;flex:none;}

.weight-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
.weight-row .wname{flex:1;font-size:12.5px;font-weight:500;}
.weight-row input[type=number]{width:60px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12.5px;padding:5px 7px;text-align:right;}
.weight-total{display:flex;justify-content:space-between;padding-top:10px;margin-top:4px;font-size:12.5px;font-weight:700;}
.weight-total.bad{color:var(--negative);}
.weight-total.ok{color:var(--positive);}

.scroll-x{overflow-x:auto;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.sec-title{font-size:13px;font-weight:700;margin:22px 0 10px;}
.sec-title:first-child{margin-top:0;}
.hr{height:1px;background:var(--border-soft);margin:18px 0;}
.muted{color:var(--muted);}
.text2{color:var(--text2);}
.demo-banner{background:var(--purple-soft);border:1px solid #3d3560;color:var(--purple);font-size:11.5px;padding:8px 14px;border-radius:var(--radius-sm);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.update-banner{background:var(--accent-soft);border-bottom:1px solid var(--accent-dim);color:var(--text);font-size:12.5px;padding:9px 20px;display:flex;align-items:center;justify-content:center;gap:14px;position:sticky;top:0;z-index:25;}
.update-banner b{font-weight:700;}
.update-banner .btn{padding:5px 12px;font-size:11.5px;min-height:auto;}
.update-banner .dismiss{cursor:pointer;color:var(--text2);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.update-banner .dismiss:hover{background:var(--elevated);}

/* ---------- mobile ---------- */
.mobile-menu-btn{display:none;}
.mobile-backdrop{display:none;}
@media(max-width:820px){
  .mobile-menu-btn{display:flex;flex:none;}
  .sidebar{
    position:fixed; z-index:60; left:0; top:0; height:100vh; width:250px;
    transform:translateX(-100%); transition:transform .18s ease;
  }
  .sidebar.mobile-open{transform:translateX(0); box-shadow:16px 0 40px #00000066;}
  .sidebar.collapsed{width:250px;}
  .sidebar.collapsed .side-label,.sidebar.collapsed .side-group,.sidebar.collapsed .brand-text,.sidebar.collapsed .nav-badge{display:block;}
  .sidebar.collapsed .nav-item{justify-content:flex-start;}
  .side-foot .collapse-btn{display:none;}
  .mobile-backdrop{display:block; position:fixed; inset:0; background:#00000080; z-index:55;}

  .topbar{padding:0 12px; gap:9px;}
  .search-wrap{max-width:none;}
  .search input{font-size:13px;}
  .save-indicator span:last-child{display:none;}
  .topbar-right{gap:7px;}
  .topbar-right .icon-btn:nth-child(3){display:none;}

  .content{padding:14px 14px 52px;}
  .page-head{flex-direction:column;align-items:stretch;gap:10px;}
  .page-head>div:last-child{width:100%;}
  .page-title{font-size:18px;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3,.grid-2{grid-template-columns:1fr;}
  .crit-row{flex-direction:column;gap:12px;}
  .radial{width:94px;height:94px;flex:none;}
  .radial-val{font-size:22px;}
  .modal-overlay{padding:0;align-items:stretch;}
  .modal{max-width:none;width:100%;min-height:100%;border-radius:0;border:none;}
  .se-row{grid-template-columns:1.3fr .8fr .8fr 1fr;font-size:11px;gap:6px;}
  .form-grid{grid-template-columns:1fr;}
  .kpi-val{font-size:20px;}
}
@media(max-width:460px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .page-title{font-size:16.5px;}
  .card{padding:13px;}
}
</style>

let CRIT_SEQ=0;
function crit(name,type){ return {id:'c'+(++CRIT_SEQ), name, type:type||'score'}; }
function cat(id,name,weight,names,tags){
  return { id, name, weight, tags:tags||[], criteria:names.map(n=>crit(n)) };
}
function fw(key,label,unitLabel,categories,valuationFields,riskExtra){
  return { key, label, unitLabel, categories, valuationFields:valuationFields||[], riskExtra:riskExtra||[] };
}

/* ---- scoring profiles: generic reweight by tag ---- */
function reweight(framework, boosts){
  const base = framework.categories.map(c=>({id:c.id, w:c.weight, tags:c.tags}));
  const boosted = base.map(c=>{
    let factor=1;
    (c.tags||[]).forEach(t=>{ if(boosts[t]) factor*=boosts[t]; });
    return {id:c.id, w:c.weight*factor};
  });
  const sum = boosted.reduce((a,b)=>a+b.w,0);
  const out={};
  boosted.forEach(c=> out[c.id] = Math.round((c.w/sum)*1000)/10 );
  return out;
}
function profilesFor(typeKey){
  const f = FRAMEWORKS[typeKey];
  const base = {}; f.categories.forEach(c=> base[c.id]=c.weight);
  return [
    {id:'default', name:'Default', weights:base},
    {id:'risk', name:'Risk Focus', weights: reweight(f,{risk:2.2})},
    {id:'value', name:'Value / Cost Focus', weights: reweight(f,{valuation:1.9})},
    {id:'balanced', name:'Quality Focus', weights: reweight(f,{valuation_adj:1.6})},
  ];
}

/* ============================================================
   SCORING HELPERS
============================================================ */
function score100(s){ return s==null? null : Math.round(s*20); }
function categoryAssessments(analysis, catId){ return (analysis.categories[catId] && analysis.categories[catId].criteria) || {}; }
function categoryScore(analysis, catDef){
  const a = categoryAssessments(analysis, catDef.id);
  const scores = catDef.criteria.map(c=> a[c.id] && a[c.id].score).filter(s=>s!=null);
  if(!scores.length) return null;
  return scores.reduce((x,y)=>x+y,0)/scores.length;
}
function categoryCompletion(analysis, catDef){
  const a = categoryAssessments(analysis, catDef.id);
  const total = catDef.criteria.length;
  const done = catDef.criteria.filter(c=> a[c.id] && a[c.id].score!=null).length;
  return total? Math.round(done/total*100) : 0;
}
function overallCompletion(analysis, framework){
  let total=0, done=0;
  framework.categories.forEach(c=>{
    c.criteria.forEach(cr=>{ total++; const a=categoryAssessments(analysis,c.id); if(a[cr.id]&&a[cr.id].score!=null) done++; });
  });
  return total? Math.round(done/total*100) : 0;
}
function overallScore(analysis, framework, weights){
  let total=0, wsum=0;
  framework.categories.forEach(c=>{
    const s = categoryScore(analysis,c);
    const w = (weights&&weights[c.id]!=null)? weights[c.id] : c.weight;
    if(s!=null){ total += score100(s)*w; wsum+=w; }
  });
  if(wsum===0) return null;
  return Math.round(total/wsum);
}
function scoreBand(v){ if(v==null) return 's-neu'; if(v>=75) return 's-high'; if(v>=55) return 's-mid'; return 's-low'; }
function avgCatScore100(inv, cats){
  const scores = cats.map(c=>categoryScore(inv.analysis,c)).filter(s=>s!=null);
  if(!scores.length) return null;
  return Math.round(score100(scores.reduce((a,b)=>a+b,0)/scores.length));
}
function bucketScores(inv){
  const f = FRAMEWORKS[inv.type];
  const valCats = f.categories.filter(c=>c.tags.includes('valuation'));
  const riskCats = f.categories.filter(c=>c.tags.includes('risk'));
  const qualCats = f.categories.filter(c=>!c.tags.includes('valuation') && !c.tags.includes('risk'));
  return { quality: avgCatScore100(inv,qualCats), valuation: avgCatScore100(inv,valCats), risk: avgCatScore100(inv,riskCats) };
}
function riskBucketLabel(v){ if(v==null) return null; if(v>=75) return {label:'Low', cls:'s-high'}; if(v>=50) return {label:'Medium', cls:'s-mid'}; return {label:'High', cls:'s-low'}; }
function riskPill(v){ const b=riskBucketLabel(v); return b? `<span class="pill ${b.cls}">${b.label}</span>` : `<span class="muted">-</span>`; }
function scorePill(v){ return v!=null? `<span class="pill ${scoreBand(v)}">${v}</span>` : `<span class="muted">-</span>`; }
function riskLabel(s){ if(s==null) return '-'; return ['','Very High','High','Moderate','Low','Very Low'][Math.round(s)]; }
function fmtDate(ts){ if(!ts) return '-'; const d=new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateTime(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' • '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function timeAgo(ts){
  const s=(Date.now()-ts)/1000;
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  const d=Math.floor(s/86400);
  if(d<30) return d+'d ago';
  return fmtDate(ts);
}
function initials(name){ return (name||'?').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

function overviewCopy(k){

function scoreDist(scored){
  const s = scored.filter(x=>x.score!=null);

  s.forEach(x=>{ const v=x.score; const idx=v<60?0:v<70?1:v<80?2:v<90?3:4; buckets[idx]++; });
  const maxB=Math.max(1,...buckets); const bl=['<60','60–69','70–79','80–89','90–100'];
  return `<div class="bar-chart">${buckets.map((v,i)=>`<div class="bar-col"><div class="bar-pct">${v||''}</div><div class="bar" style="height:${Math.max(4,v/maxB*88)}px"></div><div class="bar-lbl">${bl[i]}</div></div>`).join('')}</div><div class="muted" style="font-size:11px;margin-top:6px">Based on ${s.length} scored ${s.length===1?'analysis':'analyses'}.</div>`;
}

/* ============================================================
   WORKSPACE (single investment)
============================================================ */
function workspacePage(id, tab){
  const inv = findInv(id);
  if(!inv) return emptyState('inbox','Not found','This analysis may have been removed.');
  const f = FRAMEWORKS[inv.type];
  const t = typeInfo(inv.type);
  const w = currentFrameworkWeights(inv.type);
  const os = overallScore(inv.analysis, f, w);
  const comp = overallCompletion(inv.analysis, f);

  const tabs = ['summary','analysis','valuation','risk','thesis','history'];
  const tabLabels = {summary:'Summary',analysis:'Analysis',valuation:'Valuation',risk:'Risk',thesis:'Thesis',history:'History'};

  let body='';
  if(tab==='summary') body = wsSummary(inv,f,w,os,comp);
  else if(tab==='analysis') body = wsAnalysis(inv,f,comp);
  else if(tab==='valuation') body = wsValuation(inv,f);
  else if(tab==='risk') body = wsRisk(inv,f);
  else if(tab==='thesis') body = wsThesis(inv);
  else if(tab==='history') body = wsHistory(inv,f,w);

  return `
  ${backBtn()}
  <div class="crumb"><b data-action="goto:type:${inv.type}" style="cursor:pointer">${t.label}</b> / ${esc(inv.name)}</div>
  <div class="page-head">
    <div style="display:flex;align-items:center;gap:13px">
      <div class="row-avatar" style="width:42px;height:42px;font-size:14px">${initials(inv.name)}</div>
      <div>
        <div style="display:flex;align-items:center;gap:9px"><div class="page-title" style="margin-bottom:0">${esc(inv.name)}</div>${statusBadge(inv.status)}</div>
        <div class="page-sub">${esc(inv.identifier)}${inv.sector?' · '+esc(inv.sector):''}${inv.country?' · '+esc(inv.country):''}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="btn btn-ghost btn-sm" data-action="toggle-watch:${inv.id}">${icon('star')} ${inv.watchlist?'On Watchlist':'Add to Watchlist'}</div>
      <select class="select-native" data-bind="status:${inv.id}">${STATUSES.map(s=>`<option value="${s}" ${inv.status===s?'selected':''}>${s}</option>`).join('')}</select>
      <div class="btn btn-sm" style="background:var(--negative-soft);border-color:var(--negative);color:var(--negative)" data-action="delete-analysis:${inv.id}" title="Delete analysis">${icon('trash')} Delete</div>
    </div>
  </div>
  <div class="tabs">${tabs.map(tb=>`<div class="tab ${tb===tab?'active':''}" data-action="goto:open:${inv.id}:${tb}">${tabLabels[tb]}</div>`).join('')}</div>
  ${body}
  `;
}

function wsSummary(inv,f,w,os,comp){
  const cats = f.categories.map(c=>({c, s:categoryScore(inv.analysis,c)}));
  const th = inv.analysis.thesis||{};
  return `
  <div class="card" style="margin-bottom:14px">
    <div class="card-title" style="margin-bottom:8px">About</div>
    <textarea class="reason" style="min-height:64px" placeholder="What does this company/issuer/fund actually do? A brief description so you don't have to hold it in your head." data-blur="invfield:${inv.id}:description">${esc(inv.description)}</textarea>
  </div>
  <div class="grid grid-2" style="align-items:start">
    <div class="card" style="display:flex;gap:20px;align-items:center">
      ${radial(os)}
      <div style="flex:1">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
          <div class="card-title">Score Breakdown</div>
          ${os!=null?`<div class="card-link" data-action="score-explain:${inv.id}">Why this score? ${icon('chevron')}</div>`:''}
        </div>
        ${cats.map(x=>`<div style="display:flex;align-items:center;gap:9px;padding:5px 0">
          <span style="width:6px;height:6px;border-radius:50%;background:${x.s!=null?catDotColor(x.c.id):'var(--muted)'};flex:none"></span>
          <span style="flex:1;font-size:12px;color:var(--text2)">${x.c.name}</span>
          <span class="num" style="font-size:12.5px;font-weight:600">${x.s!=null? score100(x.s) : '-'}</span>
        </div>`).join('')}
        <div class="caveat">${icon('info')} A structured personal assessment, not an objective rating or a buy/sell signal.</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:10px">Research Status</div>
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span class="muted">Overall completion</span><span class="num">${comp}%</span></div>
      <div class="progress-track" style="width:100%;height:6px;margin-bottom:14px"><div class="progress-fill" style="width:${comp}%"></div></div>
      ${f.categories.map(c=>{ const cc=categoryCompletion(inv.analysis,c); return `<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0"><span class="muted">${c.name}</span><span class="num" style="color:${cc===100?'var(--positive)':cc===0?'var(--muted)':'var(--text2)'}">${cc===100?'Complete':cc+'%'}</span></div>`; }).join('')}
    </div>
  </div>
  <div class="sec-title">Investment Thesis</div>
  <div class="grid grid-2">
    <div class="card"><div class="card-title" style="margin-bottom:8px">Key Strengths</div><div style="font-size:12.5px;color:var(--text2);white-space:pre-wrap">${esc(th.strengths)||'<span class="muted">Not recorded yet. Add this in the Thesis tab.</span>'}</div></div>
    <div class="card"><div class="card-title" style="margin-bottom:8px">Key Concerns</div><div style="font-size:12.5px;color:var(--text2);white-space:pre-wrap">${esc(th.concerns)||'<span class="muted">Not recorded yet. Add this in the Thesis tab.</span>'}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="card-title" style="margin-bottom:8px">Thesis Summary</div><div style="font-size:12.5px;color:var(--text2);white-space:pre-wrap">${esc(th.thesis)||'<span class="muted">No thesis written yet.</span>'}</div></div>
  `;
}
function catDotColor(catId){
  const colors=['var(--accent)','var(--purple)','var(--positive)','var(--warning)'];
  let h=0; for(const c of catId) h+=c.charCodeAt(0);
  return colors[h%colors.length];
}
function radial(score){
  const pct = score==null? 0 : score;
  const deg = pct/100*360;
  const color = score==null?'var(--muted)': score>=75?'var(--positive)':score>=55?'var(--warning)':'var(--negative)';
  return `<div class="radial" style="background:conic-gradient(${color} ${deg}deg, var(--border-soft) ${deg}deg)">
    <div class="radial-inner"><div class="radial-val">${score!=null?score:'-'}</div><div class="radial-of">${score!=null?'/ 100':'not scored'}</div></div>
  </div>`;
}

function wsAnalysis(inv,f,comp){
  const open = STATE.ui.openCats[inv.id] || {};
  return `
  <div class="callout">${icon('info')} Scores are the user's structured judgment, not an automatic rating. <b>${comp}%</b> of criteria answered across ${f.categories.length} categories.</div>
  ${f.categories.map(c=>{
    const s = categoryScore(inv.analysis,c); const cc = categoryCompletion(inv.analysis,c);
    const isOpen = !!open[c.id];
    const isRisk = c.tags.includes('risk');
    return `<div class="accordion ${isOpen?'open':''}">
      <div class="acc-head" data-action="toggle-cat:${inv.id}:${c.id}">
        ${icon('chevron','acc-chev')}
        <div class="acc-title">${c.name}${isRisk?'<span class="tag">RISK</span>':''}</div>
        <div class="acc-meta"><div class="progress-track thin"><div class="progress-fill" style="width:${cc}%"></div></div><span>${cc}%</span><span class="pill ${scoreBand(s!=null?score100(s):null)}" style="min-width:34px;justify-content:center">${s!=null?score100(s):'-'}</span></div>
      </div>
      ${isOpen? `<div class="acc-body">
        ${isRisk? `<div class="scale-hint" style="margin:11px 0 2px">${icon('info')} Higher score = lower risk.</div>`:''}
        ${c.criteria.map(cr=>criterionRow(inv, c, cr, isRisk)).join('')}
      </div>` : ''}
    </div>`;
  }).join('')}
  `;
}
function criterionRow(inv, cat, cr, isRisk){
  const a = (inv.analysis.categories[cat.id] && inv.analysis.categories[cat.id].criteria[cr.id]) || {};
  const key = inv.id+':'+cat.id+':'+cr.id;
  return `<div class="criterion">
    <div class="crit-name">${cr.name}</div>
    <div class="crit-row">
      <div class="crit-field">
        <div class="crit-field-lbl">Score</div>
        <div class="scale">${[1,2,3,4,5].map(v=>`<div class="scale-btn ${isRisk?'risk':''} ${a.score===v?'on':''}" data-action="set-score:${key}:${v}">${v}</div>`).join('')}</div>
        <div class="scale-hint">${isRisk? (a.score?riskLabel(a.score)+' Risk':'Very High → Very Low Risk') : (a.score? ['','Very Weak','Weak','Average','Strong','Very Strong'][a.score] : '1 = Very Weak · 5 = Very Strong')}</div>
      </div>
      <div class="crit-field">
        <div class="crit-field-lbl">Confidence</div>
        <div class="scale">${[1,2,3,4,5].map(v=>`<div class="scale-btn ${a.confidence===v?'on':''}" data-action="set-conf:${key}:${v}" style="width:22px;height:22px;font-size:10.5px">${v}</div>`).join('')}</div>
      </div>
    </div>
    <textarea class="reason" placeholder="Reasoning: why this score?" data-blur="reason:${key}">${esc(a.reasoning)}</textarea>
    <div class="evidence-list">${(a.evidence||[]).map((e,idx)=>`<div class="evidence-chip">${icon('clip')} ${esc(e)}<button data-action="rm-evidence:${key}:${idx}">${icon('x')}</button></div>`).join('')}</div>
    <div class="add-evidence" data-action="add-evidence:${key}">${icon('plus')} Add source</div>
  </div>`;
}

function wsValuation(inv,f){
  const v = inv.analysis.valuation||{};
  const isStock = inv.type==='stock';
  const isBond = inv.type==='bond';
  return `
  <div class="callout">${icon('info')} Objective inputs below are raw data. Qualitative valuation judgment (e.g. Valuation Attractiveness) is recorded in the <b>Analysis</b> tab so score, reasoning and evidence stay together.</div>
  <div class="sec-title">Market / Objective Data</div>
  <div class="metric-grid">
    ${f.valuationFields.map(k=>`<div class="metric-box"><label>${k}</label><input type="text" placeholder="-" value="${escAttr(v[k]||'')}" data-blur="val:${inv.id}:${k}"></div>`).join('')}
  </div>
  ${isStock? dcfBlock(inv) : ''}
  ${isBond? realReturnBlock(inv) : ''}
  ${!isStock && !isBond? costBlock(inv) : ''}
  `;
}
function dcfBlock(inv){
  const d = inv.analysis.dcf||{};
  const g = parseFloat(d.growth)||0, m = parseFloat(d.margin)||0, disc = parseFloat(d.discount)||10, term = parseFloat(d.terminal)||2.5, price=parseFloat((inv.analysis.valuation||{})['Share Price'])||0;
  // simplified illustrative single-stage estimate, clearly labeled
  const estimate = price>0 ? Math.round(price * (1 + (g-disc)/100 + (term-2)/100) * 100)/100 : null;
  return `
  <div class="sec-title">DCF Workspace <span class="muted" style="font-weight:400;font-size:11px">(optional, assumption-driven)</span></div>
  <div class="metric-grid">
    <div class="metric-box"><label>Revenue Growth %</label><input type="text" placeholder="e.g. 8" value="${escAttr(d.growth||'')}" data-blur="dcf:${inv.id}:growth"></div>
    <div class="metric-box"><label>Operating Margin %</label><input type="text" placeholder="e.g. 18" value="${escAttr(d.margin||'')}" data-blur="dcf:${inv.id}:margin"></div>
    <div class="metric-box"><label>Discount Rate %</label><input type="text" placeholder="e.g. 10" value="${escAttr(d.discount||'')}" data-blur="dcf:${inv.id}:discount"></div>
    <div class="metric-box"><label>Terminal Growth %</label><input type="text" placeholder="e.g. 2.5" value="${escAttr(d.terminal||'')}" data-blur="dcf:${inv.id}:terminal"></div>
  </div>
  <div class="filter-bar">
    ${['Bear','Base','Bull'].map(s=>`<div class="chip" style="cursor:default">${s}</div>`).join('')}
  </div>
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;gap:30px;flex-wrap:wrap">
      <div><div class="muted" style="font-size:11px">Current Price</div><div class="num" style="font-size:16px;font-weight:700">${price?('$'+price):'-'}</div></div>
      <div><div class="muted" style="font-size:11px">Illustrative Estimated Value</div><div class="num" style="font-size:16px;font-weight:700">${estimate?('$'+estimate):'-'}</div></div>
      <div><div class="muted" style="font-size:11px">Margin of Safety</div><div class="num" style="font-size:16px;font-weight:700">${estimate&&price? Math.round((estimate-price)/estimate*1000)/10+'%':'-'}</div></div>
    </div>
    <div class="caveat">${icon('info')} This is a simplified, assumption-dependent estimate, not a precise valuation or a target price.</div>
  </div>`;
}
function realReturnBlock(inv){
  const v = inv.analysis.valuation||{};
  const nominal = parseFloat(v['Yield to Maturity'])||parseFloat(v['Current Yield'])||0;
  const infl = parseFloat(inv.analysis.expectedInflation)||0;
  const real = nominal? (((1+nominal/100)/(1+infl/100))-1)*100 : null;
  return `
  <div class="sec-title">Real Return</div>
  <div class="metric-grid">
    <div class="metric-box"><label>Expected Inflation %</label><input type="text" placeholder="e.g. 4" value="${escAttr(inv.analysis.expectedInflation||'')}" data-blur="field:${inv.id}:expectedInflation"></div>
    <div class="metric-box" style="background:var(--elevated)"><label>Estimated Real Return</label><div style="font-size:14.5px;font-weight:700" class="num">${real!=null?Math.round(real*10)/10+'%':'-'}</div></div>
  </div>
  <div class="caveat">${icon('info')} Real Return = (1 + Nominal) / (1 + Inflation) − 1. An estimate based on your assumptions.</div>
  `;
}
function costBlock(inv){
  const v = inv.analysis.valuation||{};
  return `<div class="callout">${icon('info')} Fund-level cost of access (expense ratio, tracking difference, tax) is captured above. Portfolio valuation and manager/strategy judgment live in the Analysis tab.</div>`;
}

function wsRisk(inv,f){
  const riskCats = f.categories.filter(c=>c.tags.includes('risk'));
  const rn = inv.analysis.riskNotes||{};
  return `
  <div class="callout">${icon('info')} <b>Higher score = lower risk.</b> These assessments are entered once in the Analysis tab and summarized here.</div>
  <div class="sec-title">Risk Scorecard</div>
  <div class="grid grid-2" style="margin-bottom:8px">
  ${riskCats.map(c=>{
    const a = categoryAssessments(inv.analysis,c.id);
    return `<div class="card">
      <div class="card-title" style="margin-bottom:8px">${c.name}</div>
      ${c.criteria.map(cr=>{ const s=a[cr.id]&&a[cr.id].score;
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border-soft)"><span style="font-size:12px;color:var(--text2)">${cr.name}</span><span class="pill ${s?( s>=4?'s-high':s===3?'s-mid':'s-low'):'s-neu'}">${riskLabel(s)}</span></div>`; }).join('')}
    </div>`;
  }).join('')}
  </div>
  <div class="sec-title">Narrative Risk Assessment</div>
  <div class="field-full"><label>Key Risks</label><textarea data-blur="risknote:${inv.id}:keyRisks" placeholder="What are the most important risks here?">${esc(rn.keyRisks)}</textarea></div>
  <div class="field-full"><label>Potential Loss Scenarios</label><textarea data-blur="risknote:${inv.id}:lossScenarios" placeholder="What could cause a large or permanent loss?">${esc(rn.lossScenarios)}</textarea></div>
  <div class="field-full"><label>What Could Change My Mind?</label><textarea data-blur="risknote:${inv.id}:whatWouldChangeMind" placeholder="What evidence would make you reassess the risk profile?">${esc(rn.whatWouldChangeMind)}</textarea></div>
  `;
}

function wsThesis(inv){
  const th = inv.analysis.thesis||{};
  const fields = [
    ['thesis','Investment Thesis','Why might this be an attractive investment?'],
    ['strengths','Key Strengths',''],
    ['concerns','Key Concerns',''],
    ['assumptions','Key Assumptions',''],
    ['catalysts','Catalysts',''],
    ['invalidate','What Could Invalidate the Thesis?',''],
    ['reconsider','What Would Make Me Sell / Reconsider?',''],
  ];
  return `
  <div class="callout">${icon('info')} This is narrative research, kept separate from the numerical score.</div>
  ${fields.map(([k,label,ph])=>`<div class="field-full"><label>${label}</label><textarea data-blur="thesis:${inv.id}:${k}" placeholder="${ph}">${esc(th[k])}</textarea></div>`).join('')}
  <div class="form-grid">

/* ============================================================
   ESCAPING
============================================================ */
function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function escAttr(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ============================================================
   EVENT HANDLING (delegation)
============================================================ */
function setDeep(obj, path, val){
  // path e.g. category.criteria.crId.score - used sparingly, most mutations are explicit below
}

function ensureCriterion(inv, catId, crId){
  if(!inv.analysis.categories[catId]) inv.analysis.categories[catId] = {criteria:{}, notes:''};
  if(!inv.analysis.categories[catId].criteria[crId]) inv.analysis.categories[catId].criteria[crId] = {score:null,confidence:null,reasoning:'',evidence:[]};
  return inv.analysis.categories[catId].criteria[crId];
}

function bindEvents(){
  root.onclick = function(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.getAttribute('data-action');
    handleAction(action, e);
  };
  root.onchange = function(e){
    const bindEl = e.target.closest('[data-bind]');
    if(bindEl){ handleBind(bindEl.getAttribute('data-bind'), bindEl.value); return; }
  };
  if(!root._blurBound){
    root.addEventListener('blur', function(e){
      const t = e.target;
      if(t.matches && t.matches('[data-blur]')){ handleBlur(t.getAttribute('data-blur'), t.value); }
    }, true);
    root._blurBound = true;
  }
  root.oninput = function(e){};

  const searchInput = document.getElementById('global-search-input');
  if(searchInput){
    searchInput.oninput = function(ev){ STATE.ui.search = ev.target.value; STATE.ui.searchOpen = true; updateSearchResults(); };
    searchInput.onfocus = function(){ STATE.ui.searchOpen = true; updateSearchResults(); };
    searchInput.onblur = function(){ setTimeout(function(){ STATE.ui.searchOpen = false; const c=document.getElementById('search-results-container'); if(c) c.innerHTML=''; }, 160); };
  }
  updateSearchResults();

  const analysesSearch = document.getElementById('analyses-search-input');
  if(analysesSearch){
    analysesSearch.oninput = function(ev){
      STATE.ui.filters.q = ev.target.value;
      const typeKey = STATE.ui.route.type;
      const container = document.getElementById('analyses-table-container');
      if(container && typeKey) container.innerHTML = analysesTableOrEmpty(filteredAnalyses(typeKey), typeKey);
    };
  }

  const importInput = document.getElementById('import-file-input');
  if(importInput){
    importInput.onchange = function(ev){
      const file = ev.target.files && ev.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(){
        try{
          const parsed = JSON.parse(reader.result);
          if(!parsed || !Array.isArray(parsed.investments)) throw new Error('bad shape');
          STATE.investments = parsed.investments;
          STATE.frameworkOverrides = parsed.frameworkOverrides || {};
          STATE.ui.isDemo = false;
          persist(); render(); toast('Data imported');
        }catch(err){ toast('Could not read that file. Expected a Keel export.'); }
      };
      reader.readAsText(file);
    };
  }
}
function updateSearchResults(){
  const c = document.getElementById('search-results-container');
  if(!c) return;
  const q = (STATE.ui.search||'').trim().toLowerCase();
  if(!STATE.ui.searchOpen || !q){ c.innerHTML=''; c.onmousedown=null; return; }
  const matches = STATE.investments.filter(i => (i.name+' '+i.identifier+' '+i.sector+' '+i.country).toLowerCase().includes(q)).slice(0,8);
  if(!matches.length){ c.innerHTML = `<div class="search-results"><div class="sr-empty">No matches for "${esc(STATE.ui.search)}"</div></div>`; c.onmousedown=null; return; }
  c.innerHTML = `<div class="search-results">${matches.map(i=>`<div class="sr-item" data-id="${i.id}"><div class="row-avatar" style="width:24px;height:24px;font-size:9.5px">${initials(i.name)}</div><div><div class="list-title" style="font-size:12px">${esc(i.name)}</div><div class="list-sub">${esc(i.identifier)} · ${typeInfo(i.type).plural}</div></div></div>`).join('')}</div>`;
  c.onmousedown = function(ev){
    const item = ev.target.closest('.sr-item');
    if(!item) return;
    ev.preventDefault();
    const id = item.getAttribute('data-id');
    STATE.ui.search=''; STATE.ui.searchOpen=false;
    const inv = findInv(id);
    if(inv) nav('workspace', inv.type, id, 'summary');
  };
}

function handleBind(kind, value){
  if(kind==='filter-status'){ STATE.ui.filters.status = value; render(); return; }
  if(kind.startsWith('rank-profile:')){ const type=kind.split(':')[1]; STATE.ui.rankProfile[type]=value; render(); return; }
  if(kind.startsWith('status:')){ const id=kind.split(':')[1]; const inv=findInv(id); inv.status=value; touch(inv); flashSave(); return; }
  if(kind.startsWith('weight:')){ const [,type,catId]=kind.split(':'); if(!STATE.frameworkOverrides[type]) STATE.frameworkOverrides[type]={};
    const f=FRAMEWORKS[type]; f.categories.forEach(c=>{ if(STATE.frameworkOverrides[type][c.id]==null) STATE.frameworkOverrides[type][c.id]=c.weight; });
    STATE.frameworkOverrides[type][catId] = parseFloat(value)||0; render(); return; }
}
function handleBlur(kind, value){
  const parts = kind.split(':');
  const tag = parts[0];
  if(tag==='reason'){ const [,id,catId,crId]=parts; const inv=findInv(id); if(!inv) return; const c=ensureCriterion(inv,catId,crId); c.reasoning=value; touch(inv); flashSave(); return; }
  if(tag==='val'){ const id=parts[1]; const key=parts.slice(2).join(':'); const inv=findInv(id); inv.analysis.valuation[key]=value; touch(inv); flashSave(); return; }
  if(tag==='dcf'){ const id=parts[1]; const key=parts[2]; const inv=findInv(id); if(!inv.analysis.dcf) inv.analysis.dcf={}; inv.analysis.dcf[key]=value; touch(inv); flashSave(); return; }
  if(tag==='field'){ const id=parts[1]; const key=parts[2]; const inv=findInv(id); inv.analysis[key]=value; touch(inv); flashSave(); return; }
  if(tag==='risknote'){ const id=parts[1]; const key=parts[2]; const inv=findInv(id); inv.analysis.riskNotes[key]=value; touch(inv); flashSave(); return; }
  if(tag==='thesis'){ const id=parts[1]; const key=parts[2]; const inv=findInv(id); if(!inv.analysis.thesis) inv.analysis.thesis={}; inv.analysis.thesis[key]=value; touch(inv); flashSave(); return; }
  if(tag==='invfield'){ const id=parts[1]; const key=parts[2]; const inv=findInv(id); inv[key]=value; touch(inv); flashSave(); return; }
}

function handleAction(action, e){
  const parts = action.split(':');
  const kind = parts[0];

  if(kind==='goto'){
    const sub = parts[1];
    if(sub==='dashboard'){ nav('dashboard'); return; }
    if(sub==='type'){ nav('type', parts[2]); return; }
    if(sub==='analyses'){ nav('analyses', parts[2]); return; }
    if(sub==='rankings'){ nav('rankings', parts[2]); return; }
    if(sub==='framework'){ nav('framework', parts[2]); return; }
    if(sub==='watchlist-type'){ nav('watchlist', parts[2], null, 'all'); return; }
    if(sub==='watchlist'){ nav('watchlist', parts[3]||null, null, parts[2]); return; }
    if(sub==='settings'){ nav('settings'); return; }
    if(sub==='open'){ const id=parts[2]; const tab=parts[3]||'summary'; nav('workspace', findInv(id).type, id, tab); return; }
    return;
  }
  if(action==='nav-dashboard'){ nav('dashboard'); return; }
  if(kind==='toggle-sidebar'){ STATE.ui.sidebarCollapsed = !STATE.ui.sidebarCollapsed; render(); return; }
  if(kind==='toggle-mobile-nav'){ STATE.ui.mobileNavOpen = !STATE.ui.mobileNavOpen; render(); return; }
  if(kind==='toggle-theme'){ STATE.ui.theme = STATE.ui.theme==='light'?'dark':'light'; persist(); render(); return; }
  if(kind==='apply-update'){ applyUpdate(); return; }
  if(kind==='dismiss-update-banner'){ STATE.ui.updateBannerDismissed = true; render(); return; }
  if(kind==='toggle-auto-refresh'){
    STATE.ui.autoRefreshOnUpdate = !STATE.ui.autoRefreshOnUpdate;
    persist(); render();
    if(STATE.ui.autoRefreshOnUpdate && updateAvailable) applyUpdate();
    return;
  }
  if(kind==='check-for-updates'){
    if(swRegistration){ swRegistration.update().then(function(){ toast('Checked for updates'); }).catch(function(){ toast('Could not check for updates'); }); }
    else toast('Service worker not active yet');
    return;
  }
  if(kind==='toggle-avatar-menu'){ STATE.ui.avatarMenuOpen = !STATE.ui.avatarMenuOpen; render(); return; }
  if(kind==='go-back'){ goBack(); return; }
  if(kind==='open'){ const id=parts[1]; nav('workspace', findInv(id).type, id, 'summary'); return; }

  if(kind==='new-analysis'){ STATE.ui.modal={type:'new', typeKey:parts[1]}; render(); return; }
  if(kind==='close-modal' || kind==='overlay-close'){ if(kind==='overlay-close' && e.target!==e.currentTarget) return; STATE.ui.modal=null; render(); return; }
  if(kind==='create-analysis'){
    const typeKey = parts[1];
    const name = document.getElementById('na_name').value.trim();
    if(!name){ toast('Name is required'); return; }
    const inv = makeInvestment({
      type:typeKey, name,
      identifier: document.getElementById('na_identifier').value.trim(),
      currency: document.getElementById('na_currency').value.trim()||'USD',
      country: document.getElementById('na_country').value.trim(),
      sector: document.getElementById('na_sector').value.trim(),
      description: document.getElementById('na_desc').value.trim(),
      status:'Draft',
    });
    STATE.investments.unshift(inv);
    STATE.ui.modal=null;
    nav('workspace', typeKey, inv.id, 'analysis');
    return;
  }

  if(kind==='toggle-watch'){ const inv=findInv(parts[1]); inv.watchlist=!inv.watchlist; touch(inv); flashSave(); return; }
  if(kind==='delete-analysis'){ STATE.ui.modal={type:'confirmDelete', id:parts[1]}; render(); return; }
  if(kind==='confirm-delete'){
    const id = parts[1];
    const inv = findInv(id);
    const typeKey = inv? inv.type : null;
    STATE.investments = STATE.investments.filter(i=>i.id!==id);
    STATE.ui.modal = null;
    if(typeKey) nav('analyses', typeKey); else nav('dashboard');
    toast('Analysis deleted');
    return;
  }
  if(kind==='toggle-cat'){ const id=parts[1], catId=parts[2]; if(!STATE.ui.openCats[id]) STATE.ui.openCats[id]={}; STATE.ui.openCats[id][catId]=!STATE.ui.openCats[id][catId]; render(); return; }

  if(kind==='set-score'){ const id=parts[1], catId=parts[2], crId=parts[3], v=parseInt(parts[4]); const inv=findInv(id); if(!inv){ toast('Could not find that analysis'); return; } const c=ensureCriterion(inv,catId,crId); c.score = c.score===v? null : v; touch(inv); flashSave(); return; }
  if(kind==='set-conf'){ const id=parts[1], catId=parts[2], crId=parts[3], v=parseInt(parts[4]); const inv=findInv(id); if(!inv){ toast('Could not find that analysis'); return; } const c=ensureCriterion(inv,catId,crId); c.confidence = c.confidence===v? null : v; touch(inv); flashSave(); return; }

  if(kind==='add-evidence'){ STATE.ui.modal={type:'evidence', key:parts.slice(1).join(':')}; render(); return; }
  if(kind==='confirm-evidence'){ const key=parts.slice(1).join(':'); const val=document.getElementById('ev_input').value.trim(); if(val){ const [id,catId,crId]=key.split(':'); const inv=findInv(id); const c=ensureCriterion(inv,catId,crId); c.evidence.push(val); touch(inv); } STATE.ui.modal=null; flashSave(); return; }
  if(kind==='rm-evidence'){ const key=parts[1]+':'+parts[2]+':'+parts[3]; const idx=parseInt(parts[4]); const [id,catId,crId]=(parts[1]+'|'+parts[2]+'|'+parts[3]).split('|'); const inv=findInv(id); const c=ensureCriterion(inv,catId,crId); c.evidence.splice(idx,1); touch(inv); flashSave(); return; }

  if(kind==='score-explain'){ STATE.ui.modal={type:'scoreExplain', id:parts[1]}; render(); return; }

  if(kind==='save-version'){
    const inv = findInv(parts[1]); const f=FRAMEWORKS[inv.type]; const w=currentFrameworkWeights(inv.type);
    const os = overallScore(inv.analysis,f,w);
    const snapshot = JSON.parse(JSON.stringify({
      categories: inv.analysis.categories,
      valuation: inv.analysis.valuation,
      dcf: inv.analysis.dcf || null,
      riskNotes: inv.analysis.riskNotes,
      thesis: inv.analysis.thesis,
    }));
    inv.analysis.versions.push({ts:Date.now(), overallScore:os, note:'Manual snapshot', snapshot});
    touch(inv); flashSave(); toast('Version saved'); return;
  }
  if(kind==='view-version'){ STATE.ui.modal={type:'versionView', id:parts[1], idx:parseInt(parts[2])}; render(); return; }
  if(kind==='restore-version'){ STATE.ui.modal={type:'confirmRestore', id:parts[1], idx:parseInt(parts[2])}; render(); return; }
  if(kind==='restore-version-confirmed'){
    const inv = findInv(parts[1]); const idx = parseInt(parts[2]); const v = inv && inv.analysis.versions[idx];
    if(v && v.snapshot){
      inv.analysis.categories = JSON.parse(JSON.stringify(v.snapshot.categories||{}));
      inv.analysis.valuation = JSON.parse(JSON.stringify(v.snapshot.valuation||{}));
      if(v.snapshot.dcf) inv.analysis.dcf = JSON.parse(JSON.stringify(v.snapshot.dcf));
      inv.analysis.riskNotes = JSON.parse(JSON.stringify(v.snapshot.riskNotes||{keyRisks:'',lossScenarios:'',whatWouldChangeMind:''}));
      inv.analysis.thesis = JSON.parse(JSON.stringify(v.snapshot.thesis||{}));
      touch(inv);
      toast('Version restored');
    }
    STATE.ui.modal=null; flashSave(); return;
  }
  if(kind==='delete-version'){ STATE.ui.modal={type:'confirmDeleteVersion', id:parts[1], idx:parseInt(parts[2])}; render(); return; }
  if(kind==='delete-version-confirmed'){
    const inv = findInv(parts[1]); const idx = parseInt(parts[2]);
    if(inv && inv.analysis.versions[idx]!=null){ inv.analysis.versions.splice(idx,1); touch(inv); toast('Version deleted'); }
    STATE.ui.modal=null; flashSave(); return;
  }

  if(kind==='reset-weights'){ delete STATE.frameworkOverrides[parts[1]]; render(); return; }

  if(kind==='export-data'){
    const payload = { exportedAt: new Date().toISOString(), investments: STATE.investments, frameworkOverrides: STATE.frameworkOverrides };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'keel-export-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Export downloaded');
    return;
  }
  if(kind==='trigger-import'){ const el=document.getElementById('import-file-input'); if(el) el.click(); return; }

  if(kind==='github-save-connection'){
    const repo = (document.getElementById('gh_repo')||{}).value || '';
    const branch = (document.getElementById('gh_branch')||{}).value || 'main';
    const token = (document.getElementById('gh_token')||{}).value || '';
    if(!repo || !token){ toast('Repo and token are required'); return; }
    STATE.github = { connected:true, repo:repo.trim(), branch:branch.trim()||'main', token:token.trim(), lastSync:null, autoSync:true };
    persist(); render();
    toast('GitHub connection saved');
    return;
  }
  if(kind==='github-disconnect'){ clearTimeout(autoSyncTimer); STATE.github = { connected:false, repo:'', branch:'main', token:'', lastSync:null, autoSync:true }; persist(); render(); toast('Disconnected'); return; }
  if(kind==='github-push'){ githubPush(); return; }
  if(kind==='github-pull'){ STATE.ui.modal={type:'confirmPull'}; render(); return; }
  if(kind==='github-pull-confirmed'){ STATE.ui.modal=null; githubPull(); return; }
  if(kind==='toggle-autosync'){ STATE.github.autoSync = !STATE.github.autoSync; if(STATE.github.autoSync) scheduleAutoSync(); else clearTimeout(autoSyncTimer); persist(); render(); return; }

  if(kind==='clear-demo' || kind==='clear-all'){
    STATE.investments = kind==='clear-all'? [] : STATE.investments.filter(i=>false);
    if(kind==='clear-all'){ STATE.frameworkOverrides={}; }
    STATE.ui.isDemo=false;
    persist(); render();
    toast(kind==='clear-all'?'App reset':'Sample data cleared');
    return;
  }
}
function toast(msg){ STATE.ui.toast=msg; render(); setTimeout(()=>{ STATE.ui.toast=null; render(); }, 2600); }

let ghNoticeShown = false;
async function githubPush(opts){
  opts = opts || {};
  const gh = STATE.github;
  if(!gh.connected){ if(!opts.silent) toast('Connect GitHub first'); return; }
  const [owner, repoName] = (gh.repo||'').split('/');
  if(!owner || !repoName){ if(!opts.silent) toast('Repo must be in the form owner/repo'); return; }
  const path = 'keel-data.json';
  const apiBase = `https://api.github.com/repos/${owner}/${repoName}/contents/${path}`;
  const payload = { exportedAt:new Date().toISOString(), investments:STATE.investments, frameworkOverrides:STATE.frameworkOverrides };
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload,null,2))));
  if(!opts.silent) toast('Pushing to GitHub…');
  try{
    let sha;
    const getRes = await fetch(apiBase+`?ref=${encodeURIComponent(gh.branch)}`, { headers:{ 'Authorization':'Bearer '+gh.token, 'Accept':'application/vnd.github+json' } });
    if(getRes.status===200){ const j = await getRes.json(); sha = j.sha; }
    else if(getRes.status!==404){ throw new Error('GitHub responded '+getRes.status); }
    const putRes = await fetch(apiBase, {
      method:'PUT',
      headers:{ 'Authorization':'Bearer '+gh.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
      body: JSON.stringify({ message:'Keel data sync: '+new Date().toISOString(), content, branch:gh.branch, sha }),
    });
    if(!putRes.ok){ const t = await putRes.text(); throw new Error('GitHub responded '+putRes.status+': '+t.slice(0,140)); }
    STATE.github.lastSync = Date.now();
    ghNoticeShown = false;
    persist(); render();
    if(!opts.silent) toast('Pushed to GitHub');
  }catch(err){
    if(!opts.silent || !ghNoticeShown){
      toast('Push failed. This only works once the file is downloaded and opened outside Claude\'s preview. '+(err&&err.message?err.message:''));
      ghNoticeShown = true;
    }
  }
}

async function githubPull(opts){
  opts = opts || {};
  const gh = STATE.github;
  if(!gh.connected){ if(!opts.silent) toast('Connect GitHub first'); return; }
  const [owner, repoName] = (gh.repo||'').split('/');
  if(!owner || !repoName){ if(!opts.silent) toast('Repo must be in the form owner/repo'); return; }
  const path = 'keel-data.json';
  const apiBase = `https://api.github.com/repos/${owner}/${repoName}/contents/${path}`;
  if(!opts.silent) toast('Pulling from GitHub…');
  try{
    const res = await fetch(apiBase+`?ref=${encodeURIComponent(gh.branch)}`, { headers:{ 'Authorization':'Bearer '+gh.token, 'Accept':'application/vnd.github+json' } });
    if(res.status===404){ toast('No keel-data.json found yet in that repo/branch — push first.'); return; }
    if(!res.ok){ throw new Error('GitHub responded '+res.status); }
    const j = await res.json();
    const decoded = decodeURIComponent(escape(atob((j.content||'').replace(/\n/g,''))));
    const parsed = JSON.parse(decoded);
    if(!parsed || !Array.isArray(parsed.investments)) throw new Error('Unexpected file contents');
    STATE.investments = parsed.investments;
    STATE.frameworkOverrides = parsed.frameworkOverrides || {};
    STATE.ui.isDemo = false;
    STATE.github.lastSync = Date.now();
    persist(); render();
    if(!opts.silent) toast('Pulled latest data from GitHub');
  }catch(err){
    toast('Pull failed. This only works once the file is downloaded and opened outside Claude\'s preview. '+(err&&err.message?err.message:''));
  }
}

/* ============================================================
   SERVICE WORKER UPDATE LIFECYCLE
============================================================ */
let swRegistration = null;
let updateAvailable = false;

function applyUpdate(){
  if(swRegistration && swRegistration.waiting){
    swRegistration.waiting.postMessage('SKIP_WAITING');
  }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./service-worker.js').then(function(reg){
      swRegistration = reg;
      if(reg.waiting && navigator.serviceWorker.controller){
        updateAvailable = true;
        if(STATE.ui.autoRefreshOnUpdate) applyUpdate(); else render();
      }
      reg.addEventListener('updatefound', function(){
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', function(){
          if(newWorker.state==='installed' && navigator.serviceWorker.controller){
            updateAvailable = true;
            STATE.ui.updateBannerDismissed = false;
            if(STATE.ui.autoRefreshOnUpdate) applyUpdate(); else render();
          }
        });
      });
    }).catch(function(){});

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}

/* ============================================================
   BOOT
============================================================ */
initState();
render();
</script>
